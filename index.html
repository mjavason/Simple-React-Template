<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site for easy frontend bootstrapping"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Simple React App</title>
    <!-- TODO: Setup your initial loader -->
    <style>
      :root {
        --accent: #00a8cc;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fff;
      }

      .initial-spinner {
        position: relative;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(0, 0, 0, 0.08);
        border-top-color: var(--accent);
        animation: initial-spin 0.8s linear infinite;
      }

      @keyframes initial-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes initial-spin-reverse {
        to {
          transform: rotate(-360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div
        id="initial-loader"
        aria-label="Loading"
        style="
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: #fff;
        "
      >
        <div
          aria-hidden="true"
          style="
            width: 32px;
            height: 32px;
            border: 4px solid #00a8cc;
            border-top-color: transparent;
            border-radius: 9999px;
            animation: initial-loader-spin 0.8s linear infinite;
          "
        ></div>
      </div>

      <style>
        @keyframes initial-loader-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
